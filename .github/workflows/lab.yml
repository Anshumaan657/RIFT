name: Synthetic lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.4", cache: pip, cache-dependency-path: backend/requirements.lock }
      - run: python -m pip install --requirement backend/requirements.lock
      - run: ruff format --check lab tests/integration
      - run: ruff check lab tests/integration
      - run: pytest tests/integration
        env:
          PYTHONPATH: lab/src:backend/src
      - run: docker compose --env-file .env.example -f infra/compose.yaml -f infra/compose.lab.yaml config --quiet
