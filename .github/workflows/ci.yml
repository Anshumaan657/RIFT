name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.4", cache: pip, cache-dependency-path: backend/requirements.lock }
      - run: python -m pip install --requirement backend/requirements.lock
      - run: python -m pip install --no-deps --editable backend
      - run: ruff format --check backend/src tests/unit tests/safety scripts
      - run: ruff check backend/src tests/unit tests/safety scripts
      - run: mypy
        working-directory: backend
      - run: pytest
        working-directory: backend
        env:
          RIFT_DATABASE_URL: postgresql+asyncpg://unused:unused@localhost/unused
          RIFT_MASTER_KEY_B64: RIFT_CI_PLACEHOLDER_KEY_NOT_FOR_USE_123456789012
          RIFT_SESSION_SECRET: RIFT_CI_PLACEHOLDER_SESSION_SECRET_123456789
          RIFT_OPERATOR_PASSWORD_HASH: $argon2id$placeholder

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.19.0", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
