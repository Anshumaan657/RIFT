name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.14", cache: pip, cache-dependency-path: backend/requirements.lock }
      - run: python -m pip install --requirement backend/requirements.lock
      - run: python -m pip install --no-deps --editable backend
      - run: ruff format --check src ../tests/unit ../tests/safety ../scripts
        working-directory: backend
      - run: ruff check src ../tests/unit ../tests/safety ../scripts
        working-directory: backend
      - run: mypy
        working-directory: backend
      - run: pytest
        working-directory: backend
        env:
          RIFT_DATABASE_URL: postgresql+asyncpg://unused:unused@localhost/unused
          RIFT_MASTER_KEY_B64: RIFT_CI_PLACEHOLDER_KEY_NOT_FOR_USE_123456789012
          RIFT_SESSION_SECRET: RIFT_CI_PLACEHOLDER_SESSION_SECRET_123456789
          RIFT_OPERATOR_PASSWORD_HASH: $argon2id$placeholder

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.19.0", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run: /tmp/gitleaks detect --source . --redact --no-banner

  dependency-and-container-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.14", cache: pip }
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --requirement backend/requirements.lock --no-deps
      - uses: actions/setup-node@v4
        with: { node-version: "22.19.0", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: docker build --provenance=false --tag rift-api:ci backend
      - run: docker build --provenance=false --target production --tag rift-frontend:ci frontend
      - run: docker build --provenance=false --tag rift-egress:ci infra/egress
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: image
          image-ref: rift-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: image
          image-ref: rift-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: image
          image-ref: rift-egress:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
