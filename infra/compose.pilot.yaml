name: rift-pilot

services:
  postgres:
    profiles: [development-only]

  api:
    ports: !reset []
    network_mode: service:egress
    networks: !reset []
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      RIFT_ENVIRONMENT: pilot
      RIFT_FRONTEND_ORIGIN: https://${RIFT_PUBLIC_HOST:?Set RIFT_PUBLIC_HOST}
      RIFT_ALLOWED_TARGET_CIDRS: ${RIFT_ALLOWED_TARGET_CIDRS:?Set exact public CIDRs}
    depends_on: !override
      egress: { condition: service_healthy }

  egress:
    build: ./egress
    environment:
      RIFT_ALLOWED_TARGET_CIDRS: ${RIFT_ALLOWED_TARGET_CIDRS:?Set exact public CIDRs}
      RIFT_DATABASE_CIDRS: ${RIFT_DATABASE_CIDRS:?Set managed PostgreSQL public CIDRs}
    cap_add: [NET_ADMIN]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    networks: [rift_ui, rift_egress]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/egress-ready"]
      interval: 5s
      timeout: 2s
      retries: 10

  worker:
    network_mode: service:egress
    networks: !reset []
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      RIFT_ENVIRONMENT: pilot
      RIFT_FRONTEND_ORIGIN: https://${RIFT_PUBLIC_HOST:?Set RIFT_PUBLIC_HOST}
      RIFT_ALLOWED_TARGET_CIDRS: ${RIFT_ALLOWED_TARGET_CIDRS:?Set exact public CIDRs}
    depends_on: !override
      egress: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "rift.worker.health", "check"]
      interval: 15s
      timeout: 3s
      retries: 3

  maintenance:
    build: ../backend
    command: ["python", "-m", "rift.maintenance.main", "daemon"]
    environment:
      RIFT_ENVIRONMENT: pilot
      RIFT_DATABASE_URL: ${RIFT_DATABASE_URL:?Set TLS database URL}
      RIFT_MASTER_KEY_B64: ${RIFT_MASTER_KEY_B64:?Set RIFT_MASTER_KEY_B64}
      RIFT_FRONTEND_ORIGIN: https://${RIFT_PUBLIC_HOST:?Set RIFT_PUBLIC_HOST}
      RIFT_SESSION_SECRET: ${RIFT_SESSION_SECRET:?Set RIFT_SESSION_SECRET}
      RIFT_OPERATOR_PASSWORD_HASH: ${RIFT_OPERATOR_PASSWORD_HASH:?Set RIFT_OPERATOR_PASSWORD_HASH}
      RIFT_ALLOWED_TARGET_CIDRS: ${RIFT_ALLOWED_TARGET_CIDRS:?Set exact public CIDRs}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: service:egress
    depends_on:
      egress: { condition: service_healthy }
    networks: !reset []

  frontend:
    build:
      context: ../frontend
      target: production
    ports: !reset []
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  tls:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine3.24@sha256:442753882674b49ae2c1de83ed67896131c0777f56df5005e356e62bc3f7e7ce
    ports: ["443:8443"]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./tls-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    secrets: [rift_tls_cert, rift_tls_key]
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_started }
    networks: [rift_ui]

  lab-placeholder:
    profiles: [never]

networks:
  rift_ui: { internal: true }
  rift_egress: {}

secrets:
  rift_tls_cert:
    file: ${RIFT_TLS_CERT_FILE:?Set RIFT_TLS_CERT_FILE}
  rift_tls_key:
    file: ${RIFT_TLS_KEY_FILE:?Set RIFT_TLS_KEY_FILE}
