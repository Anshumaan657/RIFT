[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-security"
version = "0.1.0"
description = "Controlled security validation for authorized staging targets"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "cryptography==45.0.7",
  "fastapi==0.116.1",
  "greenlet==3.5.5",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
  "weasyprint==66.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["../tests/unit", "../tests/safety"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"../tests/**/*.py" = ["S101"]
"src/rift/api/dependencies.py" = ["B008"]
"src/rift/api/routes.py" = ["B008"]
"src/rift/api/report_routes.py" = ["B008"]
"src/rift/reports/render.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rift"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["structlog.*", "weasyprint.*"]
ignore_missing_imports = true
